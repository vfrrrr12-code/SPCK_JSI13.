<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | THCS và THPT Nguyễn Tất Thành Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Plus Jakarta Sans", sans-serif !important;
        transition: all 0.3s ease !important;
      }

      :root[data-theme="dark"] {
        --bg: #030a1c;
        --text: #f0f9ff;
        --card-bg: rgba(255, 255, 255, 0.02);
        --card-border: rgba(186, 230, 253, 0.1);
        --lime: #bef264;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .brand-lime {
        color: var(--lime);
      }

      /* Split Layout Container */
      .split-container {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        width: 100%;
        max-width: 1200px;
        height: 600px;
        gap: 2rem;
        padding: 2rem;
      }

      /* Bên trái: Brand Content */
      .brand-section {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 4rem;
      }

      /* Bên phải: Login Card */
      .login-section {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bento-login-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 50px;
        padding: 3rem;
        width: 100%;
        backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      input {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid var(--card-border) !important;
        color: white !important;
        border-radius: 20px;
        padding: 1.25rem;
        width: 100%;
        text-align: center;
        font-size: 1.25rem;
        font-weight: 600;
      }

      input:focus {
        border-color: var(--lime) !important;
        outline: none;
        background: rgba(255, 255, 255, 0.08) !important;
      }

      .btn-login {
        background-color: var(--lime);
        color: #075985;
        width: 100%;
        padding: 1.25rem;
        border-radius: 20px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .btn-login:hover {
        transform: scale(0.98);
        filter: brightness(1.1);
      }

      @media (max-width: 900px) {
        .split-container {
          grid-template-columns: 1fr;
          height: auto;
          text-align: center;
        }

        .brand-section {
          padding-right: 0;
          margin-bottom: 3rem;
        }
      }
    </style>
  </head>

  <body class="antialiased">
    <div class="split-container">
      <div class="brand-section">
        <h1
          class="text-7xl md:text-8xl font-black italic uppercase tracking-tighter leading-none mb-6"
        >
          THCS và THPT<span class="brand-lime">Nguyễn Tất Thành</span>
        </h1>
        <p
          class="text-3xl md:text-4xl font-bold italic opacity-80 leading-tight"
        >
          Admin <br />
          <span class="brand-lime">check</span>
        </p>
        <p
          class="mt-8 text-[10px] font-black uppercase tracking-[0.5em] opacity-40"
        >
          Admin panel / Secure Access
        </p>
      </div>

      <div class="login-section">
        <div class="bento-login-card">
          <div class="mb-10 text-center">
            <div class="text-4xl mb-4">🔐</div>
            <h2
              class="text-sm font-black uppercase tracking-[0.3em] opacity-60"
            >
              Xác thực quyền truy cập
            </h2>
          </div>

          <div class="space-y-6">
            <input id="adminKey" type="password" placeholder="Mật khẩu Admin" />

            <button onclick="checkAuth()" class="btn-login">
              Tiến vào hệ thống
            </button>

            <div class="flex items-center justify-center gap-4 py-4">
              <div class="h-[1px] flex-1 bg-white/10"></div>
              <span
                class="text-[9px] font-black opacity-30 uppercase tracking-widest"
                >vfrrrr security</span
              >
              <div class="h-[1px] flex-1 bg-white/10"></div>
            </div>

            <a
              href="index.html"
              class="block text-center text-[10px] font-black uppercase tracking-widest opacity-40 hover:opacity-100 hover:brand-lime"
            >
              ← Quay lại trang chủ
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      function checkAuth() {
        const key = document.getElementById("adminKey").value;
        if (key === "vfrrrr123") {
          sessionStorage.setItem("isVfrrrrAdmin", "true");
          window.location.href = "admin.html";
        } else {
          alert("Mật khẩu không chính xác!");
          document.getElementById("adminKey").value = "";
        }
      }

      document.addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAuth();
      });

      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme") || "dark",
      );
    </script>
  </body>
</html>
