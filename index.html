<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFRRRR | Growth & Ads Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important; }
        
        :root[data-theme="dark"] {
            /* Thay đổi nền thành gradient tối và hiện đại hơn */
            --bg-gradient: linear-gradient(135deg, #071e3d 0%, #030a1c 100%);
            --text: #f0f9ff;
            /* Thêm hiệu ứng kính mờ (glassmorphism) cho thẻ */
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(186, 230, 253, 0.1);
            --nav-bg: rgba(12, 74, 110, 0.8); /* Nav kính mờ */
            --lime-glow: #bef264;
        }
        :root[data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --text: #075985;
            --card-bg: rgba(7, 89, 133, 0.05);
            --card-border: rgba(7, 89, 133, 0.1);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --lime-glow: #075985;
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; /* Giữ nền cố định khi cuộn */
            color: var(--text); 
        }
        .brand-lime { color: #bef264; }
        
        .nav-giant {
            padding: 1.5rem 4rem;
            width: 90%;
            max-width: 1200px;
            background: var(--nav-bg);
            border: 2px solid #bef264;
            border-radius: 100px;
            backdrop-filter: blur(15px); /* Hiệu ứng mờ nền */
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }

        /* Thêm hiệu ứng cho Bento Card */
        .bento-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 2.5rem;
            backdrop-filter: blur(10px); /* Hiệu ứng kính mờ cho card */
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease !important;
        }

        /* Hiệu ứng khi di chuột lên card */
        .bento-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(190, 242, 100, 0.3);
            border-color: rgba(190, 242, 100, 0.5);
        }

        /* Hiệu ứng trang trí góc cho card lớn */
        .bento-card-large::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            background: var(--lime-glow);
            filter: blur(50px);
            opacity: 0.2;
            pointer-events: none;
        }
        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text);
            /* Thêm dòng này để giãn dòng toàn trang */
            line-height: 1.8; 
        }

        /* Hoặc chỉ chỉnh riêng cho các đoạn mô tả */
        #heroBody, #heroSubBody {
            line-height: 2; /* Giãn rộng gấp đôi cỡ chữ */
        }
    </style>
</head>
<body class="antialiased">
    <nav class="fixed top-10 left-1/2 -translate-x-1/2 z-50 nav-giant flex justify-between items-center shadow-2xl">
        <div class="text-3xl font-black italic uppercase">VF<span class="brand-lime">RRRR</span></div>
        <div class="flex items-center gap-10 text-[10px] font-black uppercase tracking-[0.3em]">
            <a href="index.html" class="brand-lime underline underline-offset-8 decoration-2">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <button onclick="toggleTheme()" class="ml-4 p-2 bg-white/10 rounded-full">🌓</button>
        </div>
    </nav>

    <main class="pt-56 px-8 max-w-7xl mx-auto pb-20">
        <div class="mb-12">
            <h1 id="heroTitle" class="text-7xl md:text-[9rem] font-black italic uppercase tracking-tighter leading-[0.85] mb-10"></h1>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-end">
                <p id="heroBody" class="md:col-span-8 text-3xl md:text-5xl font-bold italic border-l-[12px] border-[#bef264] pl-10 opacity-90"></p>
                <div class="md:col-span-4 text-right">
                    <a href="https://ntthnue.edu.vn/" class="inline-block bg-[#bef264] text-[#075985] font-black px-12 py-6 rounded-full uppercase tracking-widest text-xs hover:scale-105 hover:shadow-[0_0_15px_rgba(190,242,100,0.5)] active:scale-95 transition-all">Tìm hiểu thêm</a>
                </div>
            </div>
        </div>

        <div class="bento-grid">
            <div class="bento-card bento-card-large col-span-12 md:col-span-8 h-[400px] overflow-hidden relative group">
                <img id="bannerImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-80 group-hover:scale-105 transition-all duration-500" alt="Ads Performance">
                <div class="relative z-10 h-full flex flex-col justify-end">
                    <div class="text-4xl font-black italic uppercase brand-lime mb-4 drop-shadow-[0_0_10px_rgba(190,242,100,0.5)]">Trường THCS và THPT Nguyễn Tất Thành</div>
                </div>
            </div>
            
            <div class="bento-card col-span-12 md:col-span-4 flex flex-col justify-center text-center border-[#bef264]/20 hover:border-[#bef264]/50 hover:bg-[#bef264]/5">
                <div class="text-6xl font-black brand-lime mb-4 drop-shadow-[0_0_10px_rgba(190,242,100,0.5)]">99%</div>
                <div class="text-[10px] font-black uppercase tracking-[0.2em] opacity-60">Conversion Rate Optimization</div>
            </div>

            <div class="bento-card col-span-12 md:col-span-12 hover:bg-white/5">
                <p id="heroSubBody" class="text-xl md:text-2xl font-medium leading-relaxed italic opacity-70"></p>
            </div>
        </div>

        <footer class="mt-32 pt-12 border-t border-white/10 flex justify-between items-center opacity-40 hover:opacity-100 transition-opacity">
            <div id="secretGate" class="text-[10px] font-black uppercase tracking-[1em] cursor-pointer hover:brand-lime">VF<br>RRRR STUDIO / EST 2026</div>
            <div class="text-[10px] font-black uppercase tracking-[0.5em]">© ALL RIGHTS RESERVED</div>
        </footer>
    </main>

    <script type="module">
        import { db, doc, getDoc } from './db.js';

        // Theme System
        window.toggleTheme = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        };
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

        // Secret Trigger
        let clickCount = 0;
        document.getElementById('secretGate').addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 3) window.location.href = 'login.html';
            setTimeout(() => { clickCount = 0; }, 2000);
        });

        // Load Content
        async function loadContent() {
            try {
                const snap = await getDoc(doc(db, 'web_content', 'home'));
                if (snap.exists()) {
                    const d = snap.data();
                    document.getElementById('heroTitle').innerText = d.title || "VFRRRR";
                    document.getElementById('heroBody').innerText = d.body || "Loading experience...";
                    document.getElementById('heroSubBody').innerText = d.subBody || "";
                    if (d.bannerUrl) document.getElementById('bannerImg').src = d.bannerUrl;
                }
            } catch (e) { console.error("Firebase Error:", e); }
        }
        loadContent();
    </script>
</body>
</html>
