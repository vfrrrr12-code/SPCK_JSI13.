<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CMS | VFRRRR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        /* Đồng bộ phông chữ và tắt mọi hiệu ứng chuyển động */
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; transition: none !important; }
        
        :root[data-theme="dark"] {
            --bg: #071e3d;
            --text: #f0f9ff;
            --card-bg: #0c4a6e;
            --input-bg: rgba(255, 255, 255, 0.05);
            --nav-bg: #0c4a6e;
        }
        :root[data-theme="light"] {
            --bg: #f0f9ff;
            --text: #075985;
            --card-bg: #ffffff;
            --input-bg: rgba(7, 89, 133, 0.05);
            --nav-bg: #ffffff;
        }

        body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
        .brand-lime { color: #bef264; }
        
        /* Menu khổng lồ đồng bộ toàn trang */
        .nav-giant {
            padding: 1.5rem 4rem;
            width: 90%;
            max-width: 1200px;
            background: var(--nav-bg);
            border: 2px solid #bef264;
            border-radius: 100px;
        }

        input, textarea, select {
            background: var(--input-bg) !important;
            border: 2px solid rgba(186, 230, 253, 0.2) !important;
            color: var(--text) !important;
            outline: none;
        }
        input:focus, textarea:focus { border-color: #bef264 !important; }
    </style>
</head>
<body class="antialiased pb-20">
    <!-- Thanh điều hướng trung tâm -->
    <nav class="fixed top-10 left-1/2 -translate-x-1/2 z-50 nav-giant flex justify-between items-center shadow-2xl">
        <div class="text-3xl font-black italic uppercase">VF<span class="brand-lime">RRRR</span></div>
        <div class="flex items-center gap-10 text-[10px] font-black uppercase tracking-[0.3em]">
            <a href="admin.html" class="brand-lime underline underline-offset-8 decoration-2">CMS</a>
            <a href="leads.html">Leads</a>
            <a href="index.html">View Site</a>
        </div>
    </nav>

    <main class="pt-56 px-8 max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-6">
            <h1 class="text-6xl md:text-8xl font-black italic uppercase tracking-tighter leading-none">
                Content <span class="brand-lime">Manager</span>
            </h1>
            <select id="pageSelect" onchange="loadData()" class="p-5 rounded-2xl font-black uppercase tracking-widest text-xs cursor-pointer">
                <option value="home">Trang Chủ</option>
                <option value="about">Giới Thiệu</option>
                <option value="contact">Liên Hệ</option>
            </select>
        </div>

        <!-- Khung chỉnh sửa nội dung khổng lồ -->
        <div style="background: var(--card-bg)" class="p-10 md:p-16 rounded-[60px] border-2 border-white/5 shadow-2xl space-y-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="space-y-3">
                    <label class="text-[10px] font-black uppercase tracking-[0.4em] ml-6 opacity-50">Tiêu đề chính (Title)</label>
                    <input type="text" id="title" class="w-full p-7 rounded-3xl font-black text-2xl uppercase italic">
                </div>
                <div class="space-y-3">
                    <label class="text-[10px] font-black uppercase tracking-[0.4em] ml-6 opacity-50">Ảnh nền (Banner URL)</label>
                    <input type="text" id="bannerUrl" class="w-full p-7 rounded-3xl font-medium">
                </div>
            </div>
            
            <div class="space-y-3">
                <label class="text-[10px] font-black uppercase tracking-[0.4em] ml-6 opacity-50">Mô tả ngắn (Body)</label>
                <textarea id="body" rows="3" class="w-full p-8 rounded-[40px] font-bold text-xl italic"></textarea>
            </div>

            <div class="space-y-3">
                <label class="text-[10px] font-black uppercase tracking-[0.4em] ml-6 opacity-50">Nội dung chi tiết (SubBody)</label>
                <textarea id="subBody" rows="6" class="w-full p-8 rounded-[40px] font-medium text-lg leading-relaxed"></textarea>
            </div>

            <button onclick="saveData()" class="w-full bg-[#bef264] text-[#075985] font-black py-8 rounded-[40px] uppercase tracking-[0.6em] text-xs shadow-xl active:scale-95">
                Cập nhật cấu hình ngay
            </button>
        </div>
    </main>

    <script type="module">
        import { db, doc, getDoc, setDoc } from './db.js';

        // Bảo mật và Theme
        if (sessionStorage.getItem("isVfrrrrAdmin") !== "true") window.location.href = "login.html";
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Hàm tải dữ liệu trang
        window.loadData = async () => {
            const page = document.getElementById('pageSelect').value;
            try {
                const snap = await getDoc(doc(db, 'web_content', page));
                if(snap.exists()){
                    const d = snap.data();
                    document.getElementById('title').value = d.title || '';
                    document.getElementById('body').value = d.body || '';
                    document.getElementById('subBody').value = d.subBody || '';
                    document.getElementById('bannerUrl').value = d.bannerUrl || '';
                }
            } catch (e) { console.error("Lỗi tải dữ liệu:", e); }
        };

        // Hàm lưu dữ liệu vào Firebase
        window.saveData = async () => {
            const page = document.getElementById('pageSelect').value;
            const btn = document.querySelector('button');
            btn.innerText = "ĐANG LƯU HỆ THỐNG...";
            
            try {
                await setDoc(doc(db, 'web_content', page), {
                    title: document.getElementById('title').value,
                    body: document.getElementById('body').value,
                    subBody: document.getElementById('subBody').value,
                    bannerUrl: document.getElementById('bannerUrl').value
                });
                alert("Hệ thống vfrrrr đã được cập nhật thành công!");
            } catch (e) { 
                alert("Lỗi lưu trữ: " + e.message); 
            } finally {
                btn.innerText = "CẬP NHẬT CẤU HÌNH NGAY";
            }
        };

        // Khởi tạo trang
        loadData();
    </script>
</body>
</html>
